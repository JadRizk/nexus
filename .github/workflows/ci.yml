name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Lint before typecheck: it is the faster of the two and catches the
      # class of mistake (a primitive token referenced directly, a ref written
      # during render) that a type error never will.
      - name: Lint (eslint + stylelint)
        run: npm run lint

      - run: npm run typecheck

      - run: npm run test

      # Coverage thresholds live in packages/react/vitest.config.ts and are set
      # just under the current measured baseline, so this fails only when
      # coverage drops — never merely because it is low.
      - name: Coverage threshold
        run: npm run test:coverage

      - name: Build (packages + reference/preview.jsx)
        run: npm run build

      # arethetypeswrong catches a package.json exports map that resolves
      # correctly at runtime but lies to TypeScript's module resolution — the
      # `import`/`require` conditions each need their own `types` entry
      # (index.d.ts vs. index.d.cts) or node16-from-CJS consumers see the ESM
      # types applied to the CommonJS build ("Masquerading as ESM"). `--pack`
      # runs `npm pack` first, so this checks the tarball a consumer actually
      # installs, not the working tree.
      #
      # tokens and react also export CSS/JSON asset subpaths, which attw always
      # flags as unresolvable for lacking a .d.ts — a limitation of attw
      # checking non-code assets, not a resolution bug. Those subpaths are
      # excluded by name rather than by switching `no-resolution` off, because
      # `--ignore-rules no-resolution` disables the rule for the WHOLE package:
      # with it, an `.` entrypoint pointing at files that do not exist still
      # reports "No problems found" and exits 0 — the exact bug class this gate
      # exists to catch. `--exclude-entrypoints` keeps the rule live on `.`.
      # graph exports only `.` and `./package.json`, so it needs no exclusion
      # and is the control showing the rule passes fully enabled.
      #
      # Invoked as @arethetypeswrong/cli, not the bare `attw` bin name: `npx
      # attw` falls through to a registry package of that name which is a
      # dependency-confusion placeholder that prints an error and exits 0, so a
      # tree missing the devDependency would silently pass this gate instead of
      # failing it.
      - name: Types are not wrong (attw --pack)
        run: |
          npx @arethetypeswrong/cli --pack packages/tokens --exclude-entrypoints tokens.css crt.css tokens.json
          npx @arethetypeswrong/cli --pack packages/react --exclude-entrypoints styles.css
          npx @arethetypeswrong/cli --pack packages/graph

      # The showcase is the only place the packages are consumed end to end, so
      # a build failure here is the earliest signal that an API change broke a
      # real consumer rather than only the tests.
      - name: Build showcase
        run: npm run build -w apps/showcase

      - name: Fail if reference/preview.jsx has drifted from packages/
        run: |
          if ! git diff --quiet -- reference/preview.jsx; then
            echo "::error file=reference/preview.jsx::reference/preview.jsx is out of date. Run 'npm run build:preview' and commit the result."
            git diff -- reference/preview.jsx
            exit 1
          fi

      # tokens.css and contrast.gen.ts are generated from tokens.json. The
      # build already fails if a theme misses the contrast floors it declares;
      # this catches the other failure mode — someone edits a generated file by
      # hand, or changes tokens.json without regenerating.
      - name: Fail if generated token files have drifted from tokens.json
        run: |
          npm run build:tokens
          if ! git diff --quiet -- packages/tokens/src/tokens.css packages/tokens/src/contrast.gen.ts; then
            echo "::error file=packages/tokens/src/tokens.json::Generated token files are out of date. Run 'npm run build:tokens' and commit the result."
            git diff -- packages/tokens/src/tokens.css packages/tokens/src/contrast.gen.ts
            exit 1
          fi

      - name: Fail if the generated stylesheet has drifted from its parts
        run: |
          npm run build:styles
          if ! git diff --quiet -- packages/react/src/styles.css; then
            echo "::error file=packages/react/src/styles.css::styles.css is out of date. Run 'npm run build:styles' and commit the result."
            git diff -- packages/react/src/styles.css
            exit 1
          fi

      - name: Documented figures match the code
        run: node scripts/check-docs.mjs

      # The three peer range is a promise about versions this repository does
      # not otherwise install: every job here uses the devDependency. This
      # compiles the graph package against the floor it advertises, so the
      # lower bound is checked rather than inherited from whatever was current
      # when someone typed it.
      - name: Graph compiles against its declared three floor
        run: node scripts/check-peer-floor.mjs

      # Every step above this one — typecheck, test, build, the showcase —
      # installs only the @types/react@18 pinned in devDependencies, never the
      # @types/react@19 half of the `react: "^18.3.0 || ^19.0.0"` peer range
      # both packages declare. That gap is exactly how useFocusTrap shipped a
      # `RefObject<T>` return type that was a real type error for a 19
      # consumer (RefObject<T> is exact under 19's types, so it told them
      # `current` could never be null): nothing here ever compiled against 19
      # to catch it. This compiles packages/react and packages/graph's own
      # source against @types/react@19 so a React-19-only type error fails
      # the same pull request that introduced it, not a downstream consumer.
      - name: React and graph compile against @types/react 19
        run: node scripts/check-react19-types.mjs

      # A changeset is how a consumer finds out what changed. Asking for one on
      # the pull request is the only moment anybody remembers the reasoning; a
      # changelog reconstructed from commit messages at release time is written
      # by whoever is releasing, about work they may not have done.
      - name: Changeset present for package changes
        if: github.event_name == 'pull_request'
        run: node scripts/check-changeset.mjs

  # A job's `container:` image has to be a static value resolved before any
  # step in that job runs, so it cannot itself read package-lock.json at
  # container-start time — but a separate job's *output* can feed it. This is
  # what stops the image tag from being a second, independently-maintained
  # copy of the version scripts/browser-tests.mjs already derives: both read
  # the same lockfile field, so a version bump can only go stale in one place.
  playwright-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - id: read
        run: |
          v=$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")
          echo "version=$v" >> "$GITHUB_OUTPUT"

  # Pixel baselines are only comparable when the renderer is, so this runs in
  # the same pinned image `npm run test:visual` uses locally. Anything else —
  # ubuntu-latest with its own font packages, or a developer's laptop — renders
  # differently enough to fail on antialiasing and teach everyone to ignore it.
  browser:
    needs: playwright-version
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.playwright-version.outputs.version }}-noble
      # Chromium needs more than the default 64MB of shared memory.
      options: --ipc=host

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Visual regression and accessibility
        run: npx playwright test

      - name: Upload diffs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: visual-diff
          path: |
            playwright-report/
            browser/.results/
          retention-days: 14
